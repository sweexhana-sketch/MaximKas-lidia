<!doctype html>
<html lang="id">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MaximKas Lidia</title><link rel="stylesheet" href="/styles.css"></head>
<body class="locked">
  <main class="app-shell">
    <header><div class="brand"><span class="logo">M</span><div><b>MaximKas Lidia</b><small>Catatan keuangan driver</small></div></div><button class="ghost" id="logoutBtn">Keluar</button></header>
    <section class="welcome"><p>Selamat datang 👋</p><h1>Keuanganmu, lebih terkontrol.</h1><span id="todayLabel"></span><small id="userLabel"></small></section>
    <section id="ownerSummary" class="owner-summary" hidden></section><section class="balance-card"><span>Saldo hari ini</span><strong id="balance">Rp0</strong><div><span><i class="income-dot"></i>Masuk <b id="income">Rp0</b></span><span><i class="expense-dot"></i>Keluar <b id="expense">Rp0</b></span></div></section>
    <section class="quick"><button class="income-action" data-type="income">＋<span>Catat pemasukan</span></button><button class="expense-action" data-type="expense">−<span>Catat pengeluaran</span></button></section>
    <section class="section-head"><div><h2>Transaksi terbaru</h2><p id="count">Memuat transaksi…</p></div><button class="link" id="showAll">Lihat semua</button></section>
    <section id="transactions" class="transaction-list"></section>
  </main>
  <nav><a class="active" href="#">⌂<span>Beranda</span></a><a href="#form">＋<span>Tambah</span></a><a href="#">▤<span>Laporan</span></a><a href="#">☻<span>Akun</span></a></nav>
  <dialog id="loginDialog"><form id="loginForm"><div class="login-brand"><span class="logo">M</span><h1>MaximKas Lidia</h1><p>Masuk untuk melanjutkan</p></div><label>Akun<select id="loginUser"><option value="driver">Driver</option><option value="admin">Admin</option></select></label><label>PIN<input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" required></label><p id="loginError" class="form-error"></p><button class="submit" type="submit">Masuk</button></form></dialog>
  <dialog id="entryDialog"><form method="dialog" id="entryForm"><div class="modal-title"><div><p id="formKicker">Pencatatan</p><h2 id="formTitle">Tambah transaksi</h2></div><button class="close" value="cancel">×</button></div><input type="hidden" id="type"><label>Tanggal<input id="date" type="date" required></label><label>Jam<input id="time" type="time" required></label><label>Kategori<select id="category" required></select></label><label>Nominal<input id="amount" type="number" min="1" inputmode="numeric" placeholder="Contoh: 50000" required></label><label>Catatan <small>(opsional)</small><input id="note" type="text" placeholder="Contoh: antar penumpang ke bandara"></label><label>Lokasi <small>(tag GPS)</small><div class="loc-row"><input id="location" type="text" placeholder="Nama tempat (opsional)"><button type="button" id="gpsBtn" class="ghost">?? Tag lokasi</button></div><small id="gpsStatus"></small></label><input type="hidden" id="lat"><input type="hidden" id="lng"><button class="submit" type="submit">Simpan transaksi</button></form></dialog>
  <template id="transactionTemplate"><article class="transaction"><div class="icon"></div><div class="transaction-info"><b></b><span></span></div><div class="transaction-amount"><strong></strong><button title="Hapus">×</button></div></article></template>
  <script src="/app.js"></script>
</body></html>
